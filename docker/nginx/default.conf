server {
  listen 80;
  index index.php index.html;
  root /web;

  server_tokens off;

  # Security headers on every response (static assets included), see #60
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass localhost:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    # Set by nginx above; avoid duplicates from PHP header() calls
    fastcgi_hide_header Strict-Transport-Security;
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header X-Powered-By;
  }

  location /.well-known/api-catalog {
    types { } default_type "application/linkset+json";
    try_files $uri/linkset.json =404;
  }
}
